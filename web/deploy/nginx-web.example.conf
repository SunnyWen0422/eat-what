# 待验收开发版：只供授权后的配置评审，不是可直接覆盖线上配置的文件。
# 把以下 location 与当前 HTTPS server 合并；保留原 server_name、TLS、日志、
# http→https、CORS map 和响应头。不要替换 backend/nginx-chishenme.conf。
# current -> /var/www/chishenme-web/releases/<releaseId>
# 永久版本资源另存 /var/www/chishenme-web/assets/web-assets/<releaseId>/
# 下列 API/health/main 策略摘自仓库基线，实际服务器基线必须另行比较。

# API保持普通前缀，让现有server点文件拒绝regex继续优先。
location /api/ {
    proxy_pass http://localhost:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering off;
    proxy_buffer_size 4k;
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header Access-Control-Allow-Headers 'Authorization, Content-Type, If-None-Match, X-Request-Id' always;
    add_header Access-Control-Expose-Headers 'ETag, X-Request-Id, Retry-After' always;
    add_header Access-Control-Max-Age 3600 always;
    # 保留现有预检策略；不代表公共 GET controller 接受 OPTIONS。
    if ($request_method = 'OPTIONS') { return 204; }
}
location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
}
location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
    try_files $uri =404;
}
location = /main {
    root /var/www/chishenme;
    try_files /main.html =404;
}
location = / {
    root /var/www/chishenme-web/current;
    try_files /index.html =404;
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
location = /index.html {
    root /var/www/chishenme-web/current;
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    # add_header 在 location 会覆盖外层继承，因此保留仓库基线头。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
location ~ "^/web-assets/[a-z0-9][a-z0-9-]{0,63}/[A-Za-z0-9_-]+-[A-Za-z0-9_-]{8,}\.(js|css|svg|png|webp|woff2|txt)$" {
    root /var/www/chishenme-web/assets;
    try_files $uri =404;
    # 不加 always，缺失资源的404不能被当成一年有效的成功资源。
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
location /web-assets/ { return 404; }
# 只用根站和固定 hash 导航。未知路径/缺失资源绝不回退到 SPA HTML。
location / { return 404; }
# 现有敏感文件拒绝规则仍需保留；ACME 的 ^~ 优先于点文件拒绝。
location ~ /\. { deny all; access_log off; log_not_found off; }
