# Nginx配置文件
# 域名: chishenme.icu
# 服务器: 60.205.194.136
#
# 使用方法：
# 1. 上传到服务器: scp nginx-chishenme.conf root@60.205.194.136:/etc/nginx/conf.d/
# 2. 测试配置: sudo nginx -t
# 3. 重启Nginx: sudo systemctl restart nginx

# HTTP - 自动跳转到HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name chishenme.icu www.chishenme.icu;
    
    # 用于Let's Encrypt证书验证（可选）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    
    # 其他所有请求重定向到HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS - 主配置
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chishenme.icu www.chishenme.icu;
    
    # ===== SSL证书配置 =====
    # 请修改为您的证书路径
    ssl_certificate /etc/nginx/ssl/chishenme.icu.pem;
    ssl_certificate_key /etc/nginx/ssl/chishenme.icu.key;
    
    # SSL优化配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # 安全头部
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # ===== 日志配置 =====
    access_log /var/log/nginx/chishenme_access.log;
    error_log /var/log/nginx/chishenme_error.log warn;
    
    # ===== API代理配置 =====
    location /api/ {
        # 代理到本地Spring Boot服务
        proxy_pass http://localhost:8080/api/;
        
        # 代理头部设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲设置
        proxy_buffering off;
        proxy_buffer_size 4k;
        
        # CORS配置（如果后端没配置的话）
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-Requested-With' always;
        add_header Access-Control-Max-Age 3600 always;
        
        # 处理OPTIONS预检请求
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }
    
    # ===== 静态页面配置 =====
    # 根路径显示静态学习练习页面
    location / {
        root /var/www/chishenme;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        
        # 静态资源缓存
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # 单独为 /main 提供选菜 & 存储静态页面
    location = /main {
        root /var/www/chishenme;
        try_files /main.html =404;
    }
    
    # ===== 健康检查 =====
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # ===== 禁止访问敏感文件 =====
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ /\.git {
        deny all;
    }
}

