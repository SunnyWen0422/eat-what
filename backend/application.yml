# Spring Boot 配置文件
server:
  port: 8080
  servlet:
    context-path: /api

spring:
  # 数据库配置
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/food?useSSL=false&serverTimezone=Asia/Shanghai
    username: food
    password: 770609
    driver-class-name: com.mysql.cj.jdbc.Driver
    
    # 连接池配置
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  # Jackson配置（JSON序列化）
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

# MyBatis配置
mybatis:
  type-aliases-package: com.eatwhat.entity
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 微信小程序配置
wechat:
  miniapp:
    appid: ${WECHAT_APPID:wxf0e75b670599834a}
    secret: ${WECHAT_SECRET:520200c71a943119ef85cf17fdb6a037}

# 日志配置
logging:
  level:
    com.eatwhat: debug
    org.springframework.web: info
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

